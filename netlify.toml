[build]
  command = "npm run build"
  publish = "dist"

# Both hosts served the same pages with nothing to choose between them, so
# Google picked www and overrode the non-www canonical this build used to
# write. One host, one set of signals.
[[redirects]]
  from = "https://pumpkinpatchesnearme.com/*"
  to = "https://www.pumpkinpatchesnearme.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/find"
  to = "/pumpkin-patches/"
  status = 301
  force = true

[[redirects]]
  from = "/find/"
  to = "/pumpkin-patches/"
  status = 301
  force = true

# Mediavine hosts the live ads.txt so it can change demand partners without a
# deploy here. force = true because Netlify serves a real file ahead of any
# redirect, and the build writes no ads.txt while Mediavine is the network.
[[redirects]]
  from = "/ads.txt"
  to = "https://adstxt.journeymv.com/sites/5e44c2e0-bcb8-46ab-98fd-b9342d32f4c6/ads.txt"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/listings.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# OmniConsole runs in a browser on claude.ai and reads this site to show a
# page's current title, headings and description beside the suggested ones.
# It cannot read that out of a frame -- same-origin policy -- and Search
# Console publishes no API for it, so the site lets that one origin read it.
# Everything served here is already public to any crawler; the only thing
# this changes is that a script on claude.ai may read the response rather
# than merely cause it. frame-ancestors is set explicitly because, where it
# is present, it overrides an X-Frame-Options added further up the chain.
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://claude.ai"
    Vary = "Origin"
    Content-Security-Policy = "frame-ancestors 'self' https://claude.ai"

[[headers]]
  for = "/data/link-graph.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/page-meta.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
