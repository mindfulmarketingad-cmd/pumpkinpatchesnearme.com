[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/find"
  to = "/pumpkin-patches/"
  status = 301
  force = true

[[redirects]]
  from = "/find/"
  to = "/pumpkin-patches/"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/listings.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
