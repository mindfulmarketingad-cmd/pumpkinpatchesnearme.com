<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of a pumpkin patch">
  <title>Pumpkin patch illustration</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4EB"/>
      <stop offset="60%" stop-color="#FFE3C7"/>
      <stop offset="100%" stop-color="#FFD3A8"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6E8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF6E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B7C79A"/>
      <stop offset="100%" stop-color="#A2B683"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FA86E"/>
      <stop offset="100%" stop-color="#79945A"/>
    </linearGradient>
    <radialGradient id="pumpkinShine" cx="36%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FF9A54"/>
      <stop offset="65%" stop-color="#F26A21"/>
      <stop offset="100%" stop-color="#E85F17"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="650" cy="120" r="160" fill="url(#sun)"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.55">
    <ellipse cx="140" cy="90" rx="55" ry="18"/>
    <ellipse cx="185" cy="82" rx="40" ry="15"/>
    <ellipse cx="470" cy="70" rx="45" ry="14"/>
    <ellipse cx="510" cy="78" rx="30" ry="11"/>
  </g>

  <!-- distant hill -->
  <path d="M0,320 C120,280 220,300 340,285 C460,270 560,300 800,270 L800,500 L0,500 Z" fill="url(#hillFar)"/>

  <!-- barn -->
  <g transform="translate(90,255)">
    <rect x="0" y="30" width="92" height="60" fill="#B1502F"/>
    <polygon points="-8,30 46,-4 100,30" fill="#8C3B22"/>
    <rect x="38" y="55" width="18" height="35" fill="#5C2A16"/>
    <rect x="10" y="42" width="14" height="14" fill="#F4E3D3" opacity="0.85"/>
    <rect x="68" y="42" width="14" height="14" fill="#F4E3D3" opacity="0.85"/>
  </g>

  <!-- near hill / field -->
  <path d="M0,360 C160,320 260,345 400,330 C560,313 640,345 800,320 L800,500 L0,500 Z" fill="url(#hillNear)"/>

  <!-- fence -->
  <g stroke="#7A5A3A" stroke-width="5" opacity="0.5">
    <line x1="520" y1="345" x2="520" y2="380"/>
    <line x1="560" y1="340" x2="560" y2="375"/>
    <line x1="600" y1="337" x2="600" y2="372"/>
    <line x1="500" y1="358" x2="620" y2="350"/>
  </g>

  <!-- pumpkins -->
  <g>
    <!-- helper pumpkin shape reused at different scales/positions -->
    <g transform="translate(150,410) scale(1.5)">
      <path d="M50 34 C44 29 35.5 30 31.5 36.5 C19 38 11 50 11 64.5 C11 81.5 22.5 94 35 94 C41 94 46 90.5 50 90.5 C54 90.5 59 94 65 94 C77.5 94 89 81.5 89 64.5 C89 50 81 38 68.5 36.5 C64.5 30 56 29 50 34 Z" fill="url(#pumpkinShine)" stroke="#A63A08" stroke-width="3"/>
      <path d="M50 42 L57 26" fill="none" stroke="#3F7A2E" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(255,425) scale(1.9)">
      <path d="M50 34 C44 29 35.5 30 31.5 36.5 C19 38 11 50 11 64.5 C11 81.5 22.5 94 35 94 C41 94 46 90.5 50 90.5 C54 90.5 59 94 65 94 C77.5 94 89 81.5 89 64.5 C89 50 81 38 68.5 36.5 C64.5 30 56 29 50 34 Z" fill="url(#pumpkinShine)" stroke="#A63A08" stroke-width="3"/>
      <path d="M50 42 L57 26" fill="none" stroke="#3F7A2E" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(85,430) scale(1.1)">
      <path d="M50 34 C44 29 35.5 30 31.5 36.5 C19 38 11 50 11 64.5 C11 81.5 22.5 94 35 94 C41 94 46 90.5 50 90.5 C54 90.5 59 94 65 94 C77.5 94 89 81.5 89 64.5 C89 50 81 38 68.5 36.5 C64.5 30 56 29 50 34 Z" fill="url(#pumpkinShine)" stroke="#A63A08" stroke-width="3"/>
      <path d="M50 42 L57 26" fill="none" stroke="#3F7A2E" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(400,430) scale(1.3)">
      <path d="M50 34 C44 29 35.5 30 31.5 36.5 C19 38 11 50 11 64.5 C11 81.5 22.5 94 35 94 C41 94 46 90.5 50 90.5 C54 90.5 59 94 65 94 C77.5 94 89 81.5 89 64.5 C89 50 81 38 68.5 36.5 C64.5 30 56 29 50 34 Z" fill="url(#pumpkinShine)" stroke="#A63A08" stroke-width="3"/>
      <path d="M50 42 L57 26" fill="none" stroke="#3F7A2E" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(320,415) scale(0.85)">
      <path d="M50 34 C44 29 35.5 30 31.5 36.5 C19 38 11 50 11 64.5 C11 81.5 22.5 94 35 94 C41 94 46 90.5 50 90.5 C54 90.5 59 94 65 94 C77.5 94 89 81.5 89 64.5 C89 50 81 38 68.5 36.5 C64.5 30 56 29 50 34 Z" fill="url(#pumpkinShine)" stroke="#A63A08" stroke-width="3"/>
      <path d="M50 42 L57 26" fill="none" stroke="#3F7A2E" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

</svg>
